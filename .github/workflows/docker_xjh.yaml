name: Docker_xjh

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
  schedule:
    - cron: '0 2 * * *'

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:

        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        # 如果空间还是不够用，可以把以下开启，清理出更多空间
        # remove-android: 'true'
        # remove-codeql: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and pull image 
      run: |
        docker pull xijiahui/oracle_database:19.3.0-ee_x64
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker rmi  xijiahui/oracle_database:19.3.0-ee_x64
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker pull xijiahui/oracle_database:19.3.0-ee_arm64
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker rmi  xijiahui/oracle_database:19.3.0-ee_arm64
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker pull xijiahui/oracle_database:12.1.0.2-ee
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker rmi  xijiahui/oracle_database:12.1.0.2-ee
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker pull xijiahui/oracle_database:12.2.0.1-ee
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker rmi  xijiahui/oracle_database:12.2.0.1-ee
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker pull xijiahui/oracle_database:18.3.0-ee
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker rmi  xijiahui/oracle_database:18.3.0-ee
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker pull xijiahui/oracle_database:11.2.0.4-ee
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker rmi  xijiahui/oracle_database:11.2.0.4-ee
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker pull xijiahui/adminer:4.8.1-oracle_x64
        docker pull xijiahui/adminer:4.8.1-oracle_arm64
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="
        docker pull xijiahui/adminer:4.8.1-oracle_x64
        docker pull xijiahui/adminer:4.8.1-oracle_arm64
        echo "=============================================================================="
        docker images
        echo "------------------------------------------------------------------------------"
        df -hT
        echo "=============================================================================="

